# Deploys to the live Firebase project on every merge into main.
#
# Requires these repository secrets (Settings -> Secrets and variables -> Actions):
#   FIREBASE_SERVICE_ACCOUNT  — the full JSON key for a service account on mfu-passport
#   VITE_FIREBASE_*           — the web app config, same values as your local .env.local
#   VITE_APP_ORIGIN           — must match Hosting exactly; booth QR payloads embed it
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-run a deploy from the Actions tab without a new commit

# Never let two deploys overlap, and never cancel one midway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to Firebase
    runs-on: ubuntu-latest
    # Attach required reviewers here (Settings -> Environments) if you want deploys gated.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Build app
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_APP_ORIGIN: ${{ secrets.VITE_APP_ORIGIN }}

      - name: Build functions
        run: npm --prefix functions run build

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15

      # Written to a file rather than passed inline so the JSON is never re-parsed by the shell.
      - name: Authenticate to Firebase
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SERVICE_ACCOUNT" > "$RUNNER_TEMP/service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/service-account.json" >> "$GITHUB_ENV"

      # The project id comes from .firebaserc; --project keeps it explicit in the log.
      #
      # FUNCTIONS_DISCOVERY_TIMEOUT: before uploading, the CLI boots the functions bundle
      # locally to ask which functions exist and gives that handshake 10s by default. A cold
      # runner regularly misses it ("Cannot determine backend specification. Timeout after
      # 10000") — see SETUP.md 3. The value is in seconds.
      #
      # --force auto-approves deleting functions that no longer exist in source. Without it a
      # non-interactive deploy aborts on any function rename or removal.
      - name: Deploy
        env:
          FUNCTIONS_DISCOVERY_TIMEOUT: 120
        run: >
          firebase deploy
          --only hosting,functions,firestore,storage
          --project mfu-passport
          --non-interactive
          --force
