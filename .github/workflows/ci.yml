# Validation pipeline: runs on every push and every PR into main.
# Nothing here touches the live Firebase project — the emulator job uses throwaway
# `demo-*` project ids, which the Firestore emulator accepts without credentials.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**']

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck, build & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20' # matches functions/package.json engines and the nodejs20 runtime
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install app dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Typecheck app
        run: npm run typecheck

      - name: Build functions
        run: npm --prefix functions run build

      # Both suites import functions/lib, so they run after the functions build.
      - name: Unit tests — points
        run: npm run test:points

      - name: Unit tests — sessions
        run: npm run test:sessions

      # Vite inlines VITE_* at build time. Unset secrets resolve to empty strings, which
      # still produces a valid bundle — so a fork PR without secrets compiles rather than fails.
      - name: Build app
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_APP_ORIGIN: ${{ secrets.VITE_APP_ORIGIN }}

  emulator-tests:
    name: Firestore emulator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # The Firestore emulator is a Java process.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Saves re-downloading the emulator jars on every run.
      - name: Cache emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}

      - name: Install app dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15

      # `emulators:exec` starts Firestore, runs the suite and tears it down.
      - name: Emulator tests — points
        run: npm run test:points:emulator

      - name: Emulator tests — sessions
        run: npm run test:sessions:emulator
